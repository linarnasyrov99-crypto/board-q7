const W = 960, H = 560;
const proj = d3.geoConicEqualArea().parallels([52, 64]).rotate([-100, 0]).center([0, 0]);
proj.fitExtent([[10, 10], [W - 10, H - 10]], G);
const path = d3.geoPath(proj);
const svg = d3.select('#map');
const gZoom = svg.append('g');
const gLand = gZoom.append('g'), gDemand = gZoom.append('g'), gRoutes = gZoom.append('g'), gCities = gZoom.append('g'), gWh = gZoom.append('g');
let zk = 1;
svg.call(d3.zoom().scaleExtent([1, 8]).translateExtent([[0, 0], [W, H]]).on('zoom', e => { zk = e.transform.k; gZoom.attr('transform', e.transform); applyZoom(); }));
function applyZoom() {
  gZoom.selectAll('text').style('font-size', (10.5 / zk) + 'px').style('stroke-width', (3 / zk) + 'px');
  gCities.selectAll('circle').attr('r', 4 / zk);
  gWh.selectAll('g.wh').each(function (w) { d3.select(this).select('circle').attr('r', w.r / zk).style('stroke-width', 1.5 / zk); d3.select(this).select('text').attr('dy', -(w.r + 4) / zk); });
  gRoutes.selectAll('line').style('stroke-width', 1 / zk);
  gDemand.selectAll('g.dm').each(function (d) { d3.select(this).select('circle').attr('r', d.r / zk); d3.select(this).select('text').attr('dy', (d.r + 12) / zk); });
  gZoom.selectAll('.city text').attr('dx', 6 / zk).attr('dy', 3 / zk);
}
gLand.selectAll('path').data(G.features).join('path').attr('class', 'land').attr('d', path);

const tip = document.getElementById('tip');
const fmtTime = iso => new Date(iso).toLocaleString('ru-RU', { timeZone: 'Asia/Yekaterinburg', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
document.getElementById('sub').textContent = `Сайт WB, карточки товаров, запрос из ${Object.keys(D.cities).length} городов · ${fmtTime(D.collected)} по Екатеринбургу`;

const pname = Object.fromEntries(D.products.map(p => [p.nm, p.name]));
const sel = document.getElementById('product');
sel.innerHTML = `<option value="all">Все товары</option>` + D.products.map(p => `<option value="${p.nm}">${p.name} · ${p.nm}</option>`).join('');
try { const s = localStorage.getItem('karta-product'); if (s && [...sel.options].some(o => o.value === s)) sel.value = s; } catch (e) {}

const short = n => n.replace(/^склад продавца\s*/i, '').replace(/^склад WB, /, 'WB ');
const hClass = h => h <= 36 ? 'good' : h <= 72 ? 'warn' : 'bad';
const hColor = h => `var(--${hClass(h)})`;
const placeText = q => q === 'name' ? 'место по названию склада' : q === 'calc' ? 'место примерное, вычислено по расстояниям' : 'место неизвестно';

// Для «Все товары» один и тот же склад у разных товаров склеиваем: FBS — по id, WB — по ближайшему городу и км
function physKey(w) { return w.kind === 'FBS' ? 'S' + w.wh : `W:${w.near}:${Math.round(w.near_km / 15)}`; }

function warehousesFor(nm) {
  const list = Object.entries(D.warehouses).filter(([, w]) => nm === 'all' || w.nm === nm);
  if (nm !== 'all') return list.map(([k, w]) => ({ ...w, key: k, items: [{ nm: w.nm, qty: w.qty }] }));
  const m = new Map();
  for (const [k, w] of list) {
    const pk = physKey(w);
    if (!m.has(pk)) m.set(pk, { ...w, key: pk, keys: [], items: [], qty: 0 });
    const g = m.get(pk); g.keys.push(k); g.items.push({ nm: w.nm, qty: w.qty }); g.qty += w.qty;
    if (w.q === 'name' || (w.q === 'calc' && g.q === 'none')) Object.assign(g, { lat: w.lat, lon: w.lon, q: w.q, source: w.source });
  }
  return [...m.values()];
}

let selected = null;
function render() {
  const nm = sel.value;
  try { localStorage.setItem('karta-product', nm); } catch (e) {}
  const whs = warehousesFor(nm).sort((a, b) => (a.days_left ?? 1e9) - (b.days_left ?? 1e9) || b.qty - a.qty);
  // склад с неизвестным местом далеко от всех городов не рисуем: точка у города соврала бы
  whs.forEach(w => w.offmap = w.q === 'none' && w.near_km > 300);
  const onmap = whs.filter(w => !w.offmap);
  const byKey = Object.fromEntries(whs.map(w => [w.key, w]));
  const dels = nm === 'all' ? [] : D.deliveries.filter(d => d.nm === nm);
  const showC = document.getElementById('showCities').checked && nm !== 'all';
  const showR = document.getElementById('showRoutes').checked && nm !== 'all';

  const r = d3.scaleSqrt().domain([0, d3.max(whs, w => w.qty) || 1]).range([4, nm === 'all' ? 22 : 16]);
  // одинаковые точки чуть разводим, чтобы не слипались
  const seen = {};
  onmap.forEach(w => { const p = proj([w.lon, w.lat]); const k = p.map(v => Math.round(v / 8)).join(','); const n = seen[k] = (seen[k] || 0) + 1; w.xy = [p[0] + (n - 1) * 9, p[1] - (n - 1) * 6]; });

  gRoutes.selectAll('line').data(showR ? dels.filter(d => !byKey[d.key].offmap) : []).join('line').attr('class', 'route')
    .attr('x1', d => proj(D.cities[d.city])[0]).attr('y1', d => proj(D.cities[d.city])[1])
    .attr('x2', d => byKey[d.key].xy[0]).attr('y2', d => byKey[d.key].xy[1]);

  const cg = gCities.selectAll('g.city').data(showC ? dels : [], d => d.city).join(enter => { const g = enter.append('g').attr('class', 'city'); g.append('circle').attr('r', 4); g.append('text').attr('dx', 6).attr('dy', 3); return g; });
  cg.attr('transform', d => `translate(${proj(D.cities[d.city])})`);
  cg.select('circle').attr('fill', d => hColor(d.h));
  cg.select('text').text(d => `${d.city} ${d.h} ч`);
  cg.on('mousemove', (e, d) => showTip(e, `<b>${d.city}</b><br>везут со склада: ${byKey[d.key].name}<br>${d.km} км · ${d.h} ч · ${d.qty} шт`)).on('mouseleave', hideTip);

  const wg = gWh.selectAll('g.wh').data(onmap, w => w.key).join(enter => { const g = enter.append('g'); g.append('circle'); g.append('text').attr('text-anchor', 'middle'); return g; });
  wg.attr('class', w => `wh ${w.kind} ${w.q === 'name' ? '' : 'approx'} ${selected === w.key ? 'sel' : ''}`)
    .attr('transform', w => `translate(${w.xy})`);
  onmap.forEach(w => w.r = r(w.qty));
  wg.select('text').text(w => w.qty);
  wg.on('mousemove', (e, w) => showTip(e, whTip(w, dels))).on('mouseleave', hideTip).on('click', (e, w) => { selected = selected === w.key ? null : w.key; render(); });
  gRoutes.selectAll('line').classed('hl', d => selected && d.key === selected);
  drawDemand();
  applyZoom();

  // панель
  const tot = d3.sum(whs, w => w.qty), fbo = d3.sum(whs.filter(w => w.kind === 'FBO'), w => w.qty);
  document.getElementById('kpis').innerHTML =
    `<div class="kpi"><b>${whs.length}</b><small>складов видно</small></div>` +
    `<div class="kpi"><b>${fbo}</b><small>шт на складах WB (по сайту)</small></div>` +
    `<div class="kpi"><b>${tot - fbo}</b><small>шт у продавца (по сайту)</small></div>`;
  document.getElementById('whList').innerHTML = whs.map(w => `
    <div class="wh-row ${selected === w.key ? 'sel' : ''}" tabindex="0" data-k="${w.key}">
      <span class="chip ${w.kind}">${w.kind}</span>
      <div><div class="nm">${w.name}</div>
        ${stockLine(w, nm)}
        <div class="src">${w.offmap ? '<b>нет на карте</b>: ' : ''}${nm === 'all' ? w.items.map(i => `${pname[i.nm] || i.nm}: ${i.qty}`).join(' · ') + '<br>' : ''}${w.source}</div></div>
      <span class="q">${w.qty}</span>
    </div>`).join('');
  document.querySelectorAll('.wh-row').forEach(el => {
    const act = () => { selected = selected === el.dataset.k ? null : el.dataset.k; render(); };
    el.onclick = act; el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } };
  });

  document.getElementById('citiesBlock').hidden = nm === 'all';
  const hy = D.history && D.history.yesterday;
  document.getElementById('evTitle').textContent = hy ? `За сутки (${hy.slice(8, 10)}.${hy.slice(5, 7)} → сегодня)` : 'За сутки';
  document.getElementById('events').innerHTML = eventsHtml(nm);
  document.getElementById('demand').innerHTML = demandHtml();
  document.getElementById('wbStock').innerHTML = wbStockHtml(nm);
  const rows = dels.filter(d => !selected || d.key === selected).sort((a, b) => b.h - a.h);
  document.getElementById('cityTbl').innerHTML = `<tr><th>Город</th><th>Склад</th><th style="text-align:right">км</th><th style="text-align:right">часы</th></tr>` +
    rows.map(d => `<tr><td>${d.city}</td><td><span class="chip ${byKey[d.key].kind}">${byKey[d.key].kind}</span> ${short(byKey[d.key].name)}</td><td class="n">${d.km}</td><td class="n h-${hClass(d.h)}">${d.h}</td></tr>`).join('');

  document.getElementById('note').innerHTML =
    `<b>Откуда данные.</b> Карточка товара на сайте WB, запрос из ${Object.keys(D.cities).length} городов (файл ${D.file}). На каждый город WB отдаёт только склад, с которого повезёт, поэтому склад, не выбранный ни для одного города, на карте не виден. ` +
    `<b>Остаток</b> — как показывает сайт, с потолком (35 = «35 и больше»); точные цифры — в кабинете. ` +
    `<b>Место склада.</b> Склады продавца — по названию в справочнике WB. Координаты складов WB сайт не отдаёт: точка вычислена по расстояниям до городов (пунктир) или стоит у ближайшего города, если расстояний мало. ` +
    (nm === 'all' ? 'В режиме «Все товары» одинаковые склады разных товаров сведены в одну точку по расстоянию.' : 'Нажми на склад, чтобы увидеть города, которые он закрывает.');
}

function stockLine(w, nm) {
  if (nm === 'all' || w.rate == null) return '';
  const [lo, hi] = D.stock_days;
  if (w.capped) return `<div class="stk">${w.qty}+ шт (потолок сайта) · скорость не видна</div>`;
  if (!w.rate) return `<div class="stk">за ${w.rate_days} сут не убывал${w.supplied ? ' · была поставка' : ''}</div>`;
  const cls = w.days_left < lo ? 'h-bad' : w.days_left <= hi ? 'h-good' : 'h-warn';
  return `<div class="stk"><span class="${cls}">хватит на ${w.days_left} дн</span> · уходит ${w.rate}/дн${w.need ? ` · довезти ~${w.need} шт до ${hi} дн` : ''}</div>`;
}
const EV = { gone: '⛔ кончился', hidden: '❔ пропал из выдачи', new: '➕ появился', switch: '⏱ дольше везут' };
function eventsHtml(nm) {
  const h = D.history; if (!h || !h.yesterday) return '<p class="note">История копится: изменения за сутки появятся со второго утреннего снимка.</p>';
  const list = h.events.filter(e => nm === 'all' || e.nm === nm);
  if (!list.length) return '<p class="note">За сутки без изменений.</p>';
  return '<ul class="ev">' + list.map(e => `<li>${nm === 'all' ? `<b>${pname[e.nm] || e.nm}</b>: ` : ''}${EV[e.type]} ` +
    (e.type === 'switch' ? `${e.city}: ${e.h_was} → ${e.h_now} ч` : `${short(e.name)}${e.was != null ? ` (был ${e.was} шт)` : e.qty != null ? `, ${e.qty} шт` : ''}`) + '</li>').join('') + '</ul>';
}
// Спрос: пузырь на округ, размер — наша доля заказов, цвет — наша доля против доли всех заказов WB
const idxClass = i => i < 0.8 ? 'bad' : i <= 1.2 ? 'warn' : 'good';
const idxText = i => i < 0.8 ? 'недобор' : i <= 1.2 ? 'как рынок' : 'перебор';
function drawDemand() {
  const sp = D.spros && D.spros.districts;
  const on = sp && document.getElementById('showDemand').checked;
  const rows = on ? sp.rows : [];
  const rs = d3.scaleSqrt().domain([0, d3.max(sp ? sp.rows : [], d => d.share) || 1]).range([0, 46]);
  rows.forEach(d => d.r = rs(d.share));
  const g = gDemand.selectAll('g.dm').data(rows, d => d.name).join(enter => { const e = enter.append('g').attr('class', 'dm'); e.append('circle'); e.append('text').attr('text-anchor', 'middle'); return e; });
  g.attr('transform', d => `translate(${proj([d.lon, d.lat])})`);
  g.select('circle').attr('class', d => 'dmc ' + idxClass(d.index));
  g.select('text').attr('class', 'dmt').text(d => `${d.share}% · WB ${d.wb_share}%`);
  g.on('mousemove', (e, d) => showTip(e, `<b>${d.name}</b><br>наша доля заказов ${d.share}% · у всего WB ${d.wb_share}%<br><b class="h-${idxClass(d.index)}">${idxText(d.index)} ×${d.index}</b> · средний срок ${Math.floor(d.h / 24)} д ${d.h % 24} ч<br><span style="color:var(--muted)">${sp.source}, ${sp.filter}, ${sp.period}</span>`)).on('mouseleave', hideTip);
}
function wbStockHtml(nm) {
  const sp = D.spros; if (!sp || !sp.products) return '<p class="note">Нет данных кабинета о заказах и запасе.</p>';
  const [lo, hi] = D.stock_days;
  const rows = D.products.filter(p => sp.products[p.nm] && (nm === 'all' || p.nm === nm)).map(p => ({ ...sp.products[p.nm], name: p.name }));
  if (!rows.length) return '<p class="note">По этому товару в отчёте кабинета данных нет.</p>';
  const cls = x => !x.per_day ? '' : x.wb_days < lo ? 'h-bad' : x.wb_days <= hi ? 'h-good' : 'h-warn';
  const what = x => x.need ? `довезти ~${x.need}` : x.excess ? `лишних ~${x.excess}` : 'в норме';
  return `<div class="tbl-wrap"><table><tr>${nm === 'all' ? '<th>Товар</th>' : ''}<th style="text-align:right">заказов/дн</th><th style="text-align:right">на WB</th><th style="text-align:right">дней</th><th>что делать</th></tr>` +
    rows.map(x => `<tr>${nm === 'all' ? `<td>${x.name}</td>` : ''}<td class="n">${x.per_day}</td><td class="n">${x.wb_qty}</td><td class="n ${cls(x)}">${x.wb_days ?? '—'}</td><td>${x.per_day ? what(x) : 'заказов нет'}</td></tr>`).join('') +
    `</table></div><p class="note">Точные цифры кабинета: заказы за ${sp.products_period} (WB + свой склад), остаток на всех складах WB вместе. Норма — ${lo}–${hi} дней заказов на WB. Остаток у продавца (FBS): ${rows.map(x => x.mp_qty).reduce((a, b) => a + b, 0)} шт.</p>`;
}
function demandHtml() {
  const sp = D.spros; if (!sp) return '<p class="note">Данных о спросе пока нет.</p>';
  const d = sp.districts, r = sp.regions;
  let html = `<div class="tbl-wrap"><table><tr><th>Округ</th><th style="text-align:right">наши</th><th style="text-align:right">весь WB</th><th style="text-align:right">срок</th></tr>` +
    [...d.rows].sort((a, b) => a.index - b.index).map(x => `<tr><td>${x.name} <span class="h-${idxClass(x.index)}">${idxText(x.index)}</span></td><td class="n">${x.share}%</td><td class="n">${x.wb_share}%</td><td class="n">${Math.floor(x.h / 24)} д ${x.h % 24} ч</td></tr>`).join('') +
    `</table></div><p class="note">Заказы, ${d.filter}, ${d.period}. ${d.source}. «Недобор» — у нас доля заказов меньше, чем у WB в целом: спрос в регионе есть, а мы его не берём.</p>`;
  if (r) html += `<h2 style="margin-top:10px">Выкупы по регионам · топ-10</h2><div class="tbl-wrap"><table><tr><th>Регион</th><th style="text-align:right">шт</th><th style="text-align:right">доля ₽</th></tr>` +
    r.rows.slice(0, 10).map(x => `<tr><td>${x.region}</td><td class="n">${x.qty}</td><td class="n">${x.share}%</td></tr>`).join('') +
    `</table></div><p class="note">Всего ${r.total_qty} шт на ${r.total_rub.toLocaleString('ru-RU')} ₽, все товары. Период: ${r.period}. ${r.source}.</p>`;
  return html;
}
function whTip(w, dels) {
  const served = dels.filter(d => d.key === w.key);
  return `<b>${w.name}</b><br>${w.kind === 'FBO' ? 'склад WB (FBO)' : 'склад продавца (FBS)'} · ${w.qty} шт<br><span style="color:var(--muted)">${placeText(w.q)}</span>` +
    (served.length ? `<br>закрывает: ${served.map(d => `${d.city} ${d.h} ч`).join(', ')}` : '');
}
function showTip(e, html) {
  const box = document.querySelector('.mapbox').getBoundingClientRect();
  tip.innerHTML = html; tip.hidden = false;
  const x = Math.min(e.clientX - box.left + 12, box.width - tip.offsetWidth - 8);
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = (e.clientY - box.top + 12) + 'px';
}
function hideTip() { tip.hidden = true; }

sel.onchange = () => { selected = null; render(); };
document.getElementById('showCities').onchange = render;
document.getElementById('showRoutes').onchange = render;
document.getElementById('showDemand').onchange = render;
render();
</script>
